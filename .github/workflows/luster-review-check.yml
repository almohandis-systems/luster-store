name: LUSTER Review Checks

on:
  pull_request:
  push:
    branches:
      - work/luster-approved-review

permissions:
  contents: read

jobs:
  review-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Parse inline JavaScript and verify approved UI safeguards
        run: node scripts/check-luster-review.cjs
