<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><title>Firestore Test</title></head>
<body style="font-family:sans-serif;font-size:22px;padding:20px">
<div id="result">جاري الاختبار...</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyChOCsdmoBwQwrv_2tezDtGJJfC8O6LBU4",
  authDomain: "luster-4a916.firebaseapp.com",
  projectId: "luster-4a916",
  storageBucket: "luster-4a916.firebasestorage.app",
  messagingSenderId: "303118390902",
  appId: "1:303118390902:web:43c5eb39696095c6533157",
  measurementId: "G-TMJ9NZ6HM2"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const out = document.getElementById("result");

try {
  await setDoc(doc(db, "test", "ping"), { at: new Date().toISOString() });
  const snap = await getDoc(doc(db, "test", "ping"));
  out.textContent = snap.exists() ? "✅ Firestore يعمل" : "❌ الكتابة نجحت لكن القراءة فشلت";
} catch (e) {
  out.textContent = "❌ خطأ: " + e.message;
}
</script>
</body>
</html>
